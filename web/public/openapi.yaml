openapi: 3.1.0
info:
  title: Wifiyka API
  version: 0.2.0
  description: >-
    Same-origin API for an offline geographic PWA. Writes use an HttpOnly session
    cookie and reject cross-origin browser requests. JSON request limit is 1 MiB.
    Account data is never stored in a shared HTTP cache. The supported client
    synchronization protocol is durable outbox delivery followed by bootstrap.
servers:
  - url: https://wifi.eval.su
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Ready
        "503":
          description: Database is unavailable
  /api/v1/session/bootstrap:
    post:
      summary: Bootstrap anonymous session
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/me:
    get:
      summary: Current authenticated profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/auth/email/start-bind:
    post:
      summary: Start email bind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent_accepted]
              properties:
                email:
                  type: string
                consent_accepted:
                  type: boolean
      responses:
        "202":
          description: Email sent
  /api/v1/auth/email/confirm-bind:
    post:
      summary: Confirm bind token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Updated user
  /api/v1/auth/email/start-login:
    post:
      summary: Start login magic link
      responses:
        "202":
          description: Email queued
  /api/v1/auth/email/confirm-login:
    post:
      summary: Confirm login token
      responses:
        "200":
          description: New authenticated session
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      responses:
        "200":
          description: Session revoked
  /api/v1/places:
    get:
      summary: Query places
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
      responses:
        "200":
          description: Places list
    post:
      summary: Create place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceInput"
      responses:
        "201":
          description: Created place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
  /api/v1/places/nearby:
    get:
      summary: Nearby places
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
        - in: query
          name: lng
          required: true
          schema:
            type: number
        - in: query
          name: radius_km
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Nearby places
  /api/v1/places/{placeId}:
    get:
      summary: Place detail
      parameters:
        - $ref: "#/components/parameters/placeId"
      responses:
        "200":
          description: Place detail
    patch:
      summary: Update own place
      parameters:
        - $ref: "#/components/parameters/placeId"
      responses:
        "200":
          description: Updated place
    delete:
      summary: Soft delete own place
      parameters:
        - $ref: "#/components/parameters/placeId"
      responses:
        "200":
          description: Deleted
  /api/v1/places/{placeId}/vote:
    post:
      summary: Upsert my vote
      parameters:
        - $ref: "#/components/parameters/placeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: Vote state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceVote"
    delete:
      summary: Delete my vote
      parameters:
        - $ref: "#/components/parameters/placeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteInput"
      responses:
        "200":
          description: Vote deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDeleteResponse"
  /api/v1/places/{placeId}/report:
    post:
      summary: Report place
      parameters:
        - $ref: "#/components/parameters/placeId"
      responses:
        "201":
          description: Report created
  /api/v1/sync/outbox:
    post:
      summary: Apply offline operations
      description: >-
        Each operation commits its mutation and receipt atomically. Replay the
        same UUID and request after a lost response; do not generate a new UUID.
        A UUID reused with different input returns 409. The batch is sequential,
        not one transaction: earlier operations may have committed if a later
        one returns 429 or 5xx. Retry the unchanged batch safely. Failed/conflict
        receipts are final; resolve the error before creating a new operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/SyncOperation"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [results, server_time]
                properties:
                  server_time: {type: string, format: date-time}
                  results:
                    type: array
                    items:
                      type: object
                      required: [client_operation_id, status]
                      properties:
                        client_operation_id: {type: string, format: uuid}
                        status: {type: string, enum: [applied, failed, conflict]}
                        entity_id: {type: string, format: uuid}
                        error_code: {type: string}
                        error_message: {type: string}
        "400": {description: Invalid operation or request}
        "401": {description: Session required}
        "409": {description: Reused operation UUID or legacy unfinished receipt}
        "429": {description: Rate limit; retry unchanged operation later}
  /api/v1/sync/bootstrap:
    get:
      summary: Bootstrap nearby and my data for offline sync
      description: >-
        Returns me, nearby_places, my_places, my_votes, offline_packs and server_time.
        Replace the current user's synchronized local records; preserve unsent
        drafts. Personal lists are complete snapshots. Nearby places are limited
        to 250. Parameters lat/lng are finite geographic coordinates; radius_km
        is required and at most 500; non-positive values select the default 100.
      responses:
        "200":
          description: Sync bootstrap payload
  /api/v1/sync/changes:
    get:
      summary: Legacy advisory changes
      deprecated: true
      description: >-
        Bounded to 1000 places, including deleted status. Requires since in RFC3339.
        Always returns requires_bootstrap=true: timestamps do not represent commit
        order and vote deletions have no tombstone in this response. Do not use
        server_time as a reliable replication cursor. Use sync/bootstrap for
        reconciliation; current PWA does not use this legacy endpoint.
      responses:
        "200":
          description: Changed entities
  /api/v1/offline/manifest:
    get:
      summary: Offline pack manifest
      description: >-
        Packs contain pack_id, region_name, url, size_bytes, version_hash (SHA-256)
        and updated_at. Currently returns the deployment's available packages;
        geographic filtering is not implemented. Validate length and SHA-256
        before replacing a downloaded package. PMTiles format version is 3.
      responses:
        "200":
          description: Pack manifest
components:
  parameters:
    placeId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SyncOperation:
      type: object
      required: [client_operation_id, entity_type, operation_type, payload]
      properties:
        client_operation_id: {type: string, format: uuid}
        entity_type: {type: string, enum: [place, place_vote]}
        entity_id:
          type: string
          format: uuid
          description: Place ID required for updates, deletes and both vote operations.
        operation_type:
          type: string
          enum: [place_create, place_update, place_delete, vote_upsert, vote_delete]
        payload:
          type: object
          description: PlaceInput, PlacePatch, VoteInput or DeleteInput according to operation_type.
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          type: object
          properties:
            session_id:
              type: string
            expires_at:
              type: string
              format: date-time
            is_secure:
              type: boolean
            cookie_name:
              type: string
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        user_type:
          type: string
        display_name:
          type: string
          nullable: true
    PlaceInput:
      type: object
      required: [venue_type, place_name, wifi_name, access_type, lat, lng]
      properties:
        venue_type:
          type: string
        place_name:
          type: string
        wifi_name:
          type: string
        description:
          type: string
          nullable: true
        promo_text:
          type: string
          nullable: true
        access_type:
          type: string
        lat:
          type: number
        lng:
          type: number
    Place:
      type: object
      allOf:
        - $ref: "#/components/schemas/PlaceInput"
        - type: object
          properties:
            place_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            status:
              type: string
            works_count:
              type: integer
            not_works_count:
              type: integer
            version:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VoteInput:
      type: object
      required: [vote]
      properties:
        vote:
          type: string
          enum: [works, not_works]
        version:
          type: integer
          nullable: true
    DeleteInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
    PlaceVote:
      type: object
      properties:
        place_vote_id:
          type: string
          format: uuid
        place_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        vote:
          type: string
          enum: [works, not_works]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VoteDeleteResponse:
      type: object
      required: [status, place_id, place_vote_id]
      properties:
        status:
          type: string
          enum: [deleted]
        place_id:
          type: string
          format: uuid
        place_vote_id:
          type: string
          format: uuid
